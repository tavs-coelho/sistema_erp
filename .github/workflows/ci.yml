name: CI

on:
  push:
    branches: ["main", "master"]
  pull_request:
    branches: ["main", "master"]

jobs:
  backend-test:
    name: Backend — lint + testes
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - uses: actions/checkout@v4

      - name: Configurar Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: apps/backend/requirements.txt

      - name: Instalar dependências
        working-directory: apps/backend
        run: pip install -r requirements.txt

      - name: Executar testes (pytest)
        working-directory: apps/backend
        env:
          DATABASE_URL: "sqlite:///./test.db"
          UPLOAD_DIR: "/tmp/erp-ci-uploads"
        run: |
          # Legacy test modules mutate DATABASE_URL at import time and some remove
          # SQLite files. Isolate each module in a new Python process.
          failures=0
          for file in tests/test_*.py; do
            rm -f test*.db
            echo "===== Running $file ====="
            if ! pytest "$file" -q --tb=short; then
              failures=$((failures + 1))
            fi
          done
          echo "Failed test modules: $failures"
          test "$failures" -eq 0

  frontend-lint-build:
    name: Frontend — lint + build
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - uses: actions/checkout@v4

      - name: Configurar Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: apps/frontend/package-lock.json

      - name: Instalar dependências
        working-directory: apps/frontend
        run: npm ci

      - name: Impedir regressão de JWT no JavaScript
        run: python3 scripts/check_frontend_auth_migration.py

      - name: Lint
        working-directory: apps/frontend
        run: npm run lint

      - name: Build de produção
        working-directory: apps/frontend
        run: npm run build

  docker-compose-validate:
    name: Docker Compose — validação de sintaxe
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - uses: actions/checkout@v4

      - name: Verificar sintaxe do docker-compose.yml
        run: docker compose config --quiet

  tenant-security-tests:
    name: Segurança — autenticação e isolamento multi-entidade
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: apps/backend/requirements.txt
      - name: Instalar dependências
        working-directory: apps/backend
        run: pip install -r requirements.txt
      - name: Testar autenticação e segregação
        working-directory: apps/backend
        env:
          DATABASE_URL: "sqlite:///./tenant_security_test.db"
        run: |
          pytest -v --tb=short \
            tests/test_auth_tenant_boundaries.py \
            tests/test_password_reset_tenant.py \
            tests/test_tenant_middleware_security.py \
            tests/test_production_config.py \
            tests/test_mfa_sessions.py \
            tests/test_device_sessions.py \
            tests/test_device_session_migration.py \
            tests/test_browser_cookie_auth.py

  postgres-session-migration:
    name: PostgreSQL — migração de sessões e rotação
    runs-on: ubuntu-latest
    permissions:
      contents: read
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: erp_ci
          POSTGRES_PASSWORD: ci_only_password
          POSTGRES_DB: erp_ci
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U erp_ci -d erp_ci"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
    env:
      DATABASE_URL: "postgresql+psycopg2://erp_ci:ci_only_password@localhost:5432/erp_ci"
      DEMO_MODE: "true"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: apps/backend/requirements.txt
      - name: Instalar dependências
        working-directory: apps/backend
        run: pip install -r requirements.txt
      - name: Preparar esquema anterior (sintético)
        working-directory: apps/backend
        run: python -m scripts.verify_postgres_device_session bootstrap
      - name: Atualizar Alembic para revisão 0020
        working-directory: apps/backend
        run: |
          alembic stamp 0019_user_mfa_sessions
          alembic upgrade 0020_device_sessions
      - name: Validar rotação e replay no PostgreSQL
        working-directory: apps/backend
        run: python -m scripts.verify_postgres_device_session verify
  
  postgres-fresh-install:
    name: PostgreSQL — instalação limpa desde revisão 0001
    runs-on: ubuntu-latest
    permissions:
      contents: read
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: erp_ci
          POSTGRES_PASSWORD: only_for_ephemeral_ci
          POSTGRES_DB: erp_fresh_ci
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U erp_ci -d erp_fresh_ci"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
    env:
      DATABASE_URL: "postgresql+psycopg2://erp_ci:only_for_ephemeral_ci@localhost:5432/erp_fresh_ci"
      DEMO_MODE: "true"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: apps/backend/requirements.txt
      - name: Instalar dependências
        working-directory: apps/backend
        run: pip install -r requirements.txt
      - name: Aplicar todas as migrações em banco vazio
        working-directory: apps/backend
        run: alembic upgrade head
      - name: Validar head e esquema completo
        working-directory: apps/backend
        run: |
          alembic current
          python -m scripts.verify_fresh_postgres_schema
      - name: Verificar aplicação básica no banco migrado
        working-directory: apps/backend
        run: |
          python -c "from app.main import app; from app.db import SessionLocal; from sqlalchemy import text; s=SessionLocal(); print('db:',s.execute(text('select 1')).scalar()); s.close(); print('routes:', len(app.routes))"

  browser-end-to-end:
    name: E2E real — navegador, API, PostgreSQL e fluxos financeiros
    # Playwright Chromium currently supports 24.04; runner latest is 26.04.
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: apps/frontend/package-lock.json
      - name: Subir ERP completo em modo demo isolado
        run: |
          docker compose up -d --build
          # Containers may be "started" while Alembic/seed and Next are booting.
          curl -fsS --max-time 5 --retry 45 --retry-delay 5 --retry-all-errors http://127.0.0.1:8000/
          curl -fsS --max-time 5 --retry 45 --retry-delay 5 --retry-all-errors http://127.0.0.1/login
      - name: Instalar Playwright e Chromium
        working-directory: apps/frontend
        run: |
          npm ci
          npx playwright install --with-deps chromium
      - name: Navegação e fluxo contábil real
        working-directory: apps/frontend
        env:
          PLAYWRIGHT_BASE_URL: http://127.0.0.1
        run: npm run test:e2e
      - name: Capturar logs para diagnóstico
        if: failure()
        run: docker compose logs --no-color --tail=250
      - name: Encerrar serviços temporários
        if: always()
        run: docker compose down -v --remove-orphans

  erp-e2e-compose:
    name: ERP real — login, protocolo e tramitação via Docker
    runs-on: ubuntu-latest
    permissions:
      contents: read
    timeout-minutes: 25
    env:
      DEMO_MODE: "true"
      BROWSER_COOKIE_AUTH_ENABLED: "true"
      BROWSER_COOKIE_SECURE: "false"
      ERP_SMOKE_ALLOW_DEMO: "1"
      ERP_SMOKE_URL: "http://localhost"
    steps:
      - uses: actions/checkout@v4
      - name: Build e inicialização dos quatro serviços
        run: |
          docker compose build backend frontend
          docker compose up -d
      - name: Fluxo real com dados persistidos no PostgreSQL
        run: python3 scripts/smoke_browser_erp.py
      - name: Diagnóstico de execução em caso de falha
        if: failure()
        run: |
          docker compose ps
          docker compose logs --tail=120 backend frontend nginx db
      - name: Encerrar implantação efêmera
        if: always()
        run: docker compose down -v --remove-orphans
