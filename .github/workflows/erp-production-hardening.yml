name: ERP Production Hardening
on:
  push:
    branches: [feature/erp-platform-deployment-hardening-20261103]
  pull_request:
    branches: [main, feature/erp-browser-cookie-csrf-20261103]

jobs:
  hardening:
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: apps/backend/requirements.txt
      - name: Dependencias
        working-directory: apps/backend
        run: pip install -r requirements.txt
      - name: Testes de health, tracing e security headers
        working-directory: apps/backend
        env:
          DATABASE_URL: sqlite:///./test-platform.db
        run: pytest tests/test_operational.py -q
      - name: Homologacao estatica de configuracao segura
        working-directory: apps/backend
        run: |
          export DEMO_MODE=false
          export SECRET_KEY="$(python -c 'import secrets; print(secrets.token_urlsafe(48))')"
          export MFA_ENCRYPTION_KEY="$(python -c 'from cryptography.fernet import Fernet; print(Fernet.generate_key().decode())')"
          export DATABASE_URL="postgresql+psycopg2://ci:ephemeral@db:5432/erp"
          export ERP_PUBLIC_ORIGIN="https://erp.example.org"
          export CORS_ALLOWED_ORIGINS="https://erp.example.org"
          export BROWSER_COOKIE_AUTH_ENABLED=true
          export BROWSER_COOKIE_SECURE=true
          python -m scripts.production_preflight
          if DEMO_MODE=true python -m scripts.production_preflight; then
            echo "ERRO: preflight aceitou modo demonstracao"; exit 1
          fi
